<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CH Barber Studio · Barbería en Arganda del Rey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== COLORES: cambia solo estas 4 líneas para otro negocio ===== */
:root{--bg:#0a0a0a;--panel:#141414;--gold:#c9a15a;--cta:#c0392b;
 --txt:#e9e6df;--mute:#9a968c;--line:#262626;
 --head:'Oswald',Impact,sans-serif;--body:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);background:var(--bg);color:var(--txt);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--head);text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.btn{display:inline-block;font-family:var(--head);text-transform:uppercase;letter-spacing:.08em;font-size:.9rem;padding:14px 30px;background:var(--gold);color:#111;font-weight:500;border:0;cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:#e0b86f}
.btn.red{background:var(--cta);color:#fff}.btn.red:hover{background:#a02f23}
.btn.sm{padding:9px 18px;font-size:.78rem}

.top{background:var(--gold);color:#111;font-size:.82rem;padding:6px 0}
.top .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
nav.bar{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:70px;gap:20px}
nav.bar .l,nav.bar .r{display:flex;gap:26px;font-family:var(--head);text-transform:uppercase;font-size:.85rem;letter-spacing:.08em}
nav.bar .r{justify-content:flex-end}
nav.bar a:hover{color:var(--gold)}
.logo{font-family:var(--head);font-size:1.5rem;letter-spacing:.2em;color:var(--gold)}

.hero{position:relative;min-height:88vh;display:grid;place-items:center;text-align:center;overflow:hidden;isolation:isolate}
.hero .bg{position:absolute;inset:-5%;z-index:-2;background:var(--hero,radial-gradient(circle at 30% 30%,#3a2d1a,#0a0a0a 70%)) center/cover;animation:zoom 22s ease-in-out infinite alternate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,10,10,.55),rgba(10,10,10,.85))}
@keyframes zoom{to{transform:scale(1.12)}}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);max-width:16ch;margin:0 auto 14px}
.hero p{color:#cfcabd;max-width:52ch;margin:0 auto 30px;font-size:1.1rem}

section{padding:96px 0}
.sec-t{text-align:center;margin-bottom:46px}
.sec-t span{font-family:var(--head);color:var(--gold);letter-spacing:.25em;font-size:.82rem;text-transform:uppercase}
.sec-t h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-top:6px}
.sec-t p{color:var(--mute);max-width:56ch;margin:10px auto 0}

.about .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.about h2{font-size:clamp(1.9rem,4vw,2.8rem);margin:6px 0 16px}
.about p{color:var(--mute);margin-bottom:12px}
.ph{background:linear-gradient(150deg,#1e1e1e,#0f0f0f);display:grid;place-items:center;color:#555;font-size:.85rem;text-align:center;padding:16px;background-size:cover;background-position:center}
.about .ph{aspect-ratio:4/5;border:1px solid var(--line)}

.stats{background:linear-gradient(90deg,#8b6a2f,var(--gold),#8b6a2f);color:#111;padding:44px 0}
.stats .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;text-align:center}
.stats b{display:block;font-family:var(--head);font-size:clamp(2rem,5vw,3rem);line-height:1}
.stats span{font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;font-size:.78rem}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--panel);border:1px solid var(--line);transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-6px);border-color:var(--gold)}
.card .ph{aspect-ratio:4/3}
.card .t{padding:22px}
.card h3{font-size:1.2rem;color:var(--gold);margin-bottom:8px}
.card p{color:var(--mute);font-size:.95rem;margin-bottom:16px}

.cta{background:linear-gradient(rgba(10,10,10,.6),rgba(10,10,10,.6)),var(--hero,linear-gradient(120deg,#5a4320,#8b6a2f));background-size:cover;background-position:center;text-align:center;padding:84px 0}
.cta h2{font-size:clamp(1.8rem,4vw,2.6rem);margin-bottom:10px}
.cta p{color:#d8d2c2;margin-bottom:26px}

.rate{text-align:center;margin-bottom:28px}
.rate b{font-family:var(--head);font-size:1.4rem;letter-spacing:.1em}
.stars{color:#f5b301;letter-spacing:.15em;font-size:1.2rem}
.rate small{display:block;color:var(--mute)}
.rev{background:var(--panel);border:1px solid var(--line);padding:22px}
.rev .who{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-weight:600}
.rev .av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font-family:var(--head)}
.rev p{color:#c9c5ba;font-size:.95rem}
.note{text-align:center;color:#6d6a62;font-size:.8rem;margin-top:18px}

.contact .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.contact h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:14px}
.contact address{font-style:normal;color:var(--mute);margin-bottom:22px;font-size:1.1rem}
.map{display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:4/3;padding:26px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,#111 0 16px,#151515 16px 32px)}
.map b{font-family:var(--head);color:var(--gold);text-transform:uppercase;letter-spacing:.1em}
footer{border-top:1px solid var(--line);color:#6d6a62;font-size:.85rem;padding:26px 0}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.wa{position:fixed;right:18px;bottom:18px;z-index:30;width:58px;height:58px;border-radius:50%;background:#1fa855;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.5);transition:transform .2s}
.wa:hover{transform:scale(1.08)}
.wa svg{width:30px;height:30px;fill:#fff}

.rv{opacity:0;transform:translateY(28px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
@media (max-width:820px){
 nav.bar .wrap{grid-template-columns:1fr auto}nav.bar .l{display:none}nav.bar .r a:not(.btn){display:none}
 .about .wrap,.contact .wrap{grid-template-columns:1fr}
 .stats .wrap{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}
 section{padding:68px 0}.top .wrap{justify-content:center}
 .logo{font-size:1.05rem;letter-spacing:.1em}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>

<script>
/* ===== CONFIGURACIÓN: edita solo este bloque para cada negocio ===== */
var CFG={
 name:"CH BARBER STUDIO", short:"CH",
 top:["📍 Calle Real, 2 · Arganda del Rey","Reserva tu cita online"],
 wa:"", book:"https://chbarberstudio.booksy.com/k", ig:"https://www.instagram.com/ch.barber.studio/",
 address:"Calle Real, 2 · Arganda del Rey", maps:"Calle+Real+2+Arganda+del+Rey",
 heroImg:"", aboutImg:"",
 title:"Cuidamos tu imagen", sub:"Cortes, degradados y barba a medida en Arganda del Rey. Reserva tu cita online en un minuto.",
 btn:"Reservar cita",
 about:["En CH Barber Studio trabajamos cada corte al detalle: degradados limpios, acabados cuidados y un local luminoso donde da gusto sentarse.","Elige tu hora, reserva online y ven. Nosotros nos encargamos del resto."],
 stats:[[10,"Descuento lun–mié, 10:00–11:30","%"],[1,"Barbero, atención personal",""],[24,"Reserva online a cualquier hora","h"]],
 services:[["Corte y degradado","Fade bajo, medio o alto, perfilado y acabado a tu estilo.",""],["Arreglo de barba","Perfilado y cuidado de la barba para un look limpio.",""],["Corte + barba","El servicio completo en una sola cita.",""]],
 ctaT:"10% de descuento de lunes a miércoles", ctaP:"De 10:00 a 11:30 de la mañana, en cualquier servicio.", ctaB:"Reservar ahora",
 reviews:[["Álvaro G.","Muy buen trato y un degradado perfecto. Repetiré seguro."],["Dani R.","Local limpio, puntual y el corte justo como lo quería."],["Marcos P.","Me asesoraron sobre el estilo y quedé encantado."]],
 rating:"", total:""
};
</script>

<div class="top"><div class="wrap"><span id="tEmail"></span><span id="tPhone"></span></div></div>
<nav class="bar"><div class="wrap">
  <div class="l"><a href="#inicio">Inicio</a><a href="#estudio">Estudio</a><a href="#servicios">Servicios</a></div>
  <a class="logo" href="#" id="logo"></a>
  <div class="r"><a href="#opiniones">Opiniones</a><a href="#contacto">Contacto</a><a class="btn red sm" id="navBtn" target="_blank" rel="noopener"></a></div>
</div></nav>

<header class="hero" id="inicio"><div class="bg" id="heroBg"></div>
  <div class="wrap"><h1 id="hTitle"></h1><p id="hSub"></p><a class="btn" id="hBtn" target="_blank" rel="noopener"></a></div>
</header>

<section class="about" id="estudio"><div class="wrap">
  <div class="rv"><span class="sec-t" style="text-align:left;display:block"><span>Sobre nosotros</span></span><h2 id="aTitle"></h2><div id="aText"></div><a class="btn" href="#servicios" style="margin-top:10px">Nuestros servicios</a></div>
  <div class="ph rv" id="aImg">Foto del estudio</div>
</div></section>

<div class="stats"><div class="wrap" id="stats"></div></div>

<section id="servicios"><div class="wrap">
  <div class="sec-t rv"><span>Qué hacemos</span><h2>Nuestros servicios</h2></div>
  <div class="grid3" id="svc"></div>
</div></section>

<div class="cta"><div class="wrap rv"><h2 id="ctaT"></h2><p id="ctaP"></p><a class="btn red" id="ctaBtn" target="_blank" rel="noopener"></a></div></div>

<section id="opiniones"><div class="wrap">
  <div class="sec-t rv"><span>Opiniones</span><h2>Lo que dicen nuestros clientes</h2></div>
  <div class="rate rv"><b>EXCELENTE</b><div class="stars">★★★★★</div><small id="rateTxt"></small></div>
  <div class="grid3" id="revs"></div>
  <p class="note">Reseñas de ejemplo: se sustituyen por las reales de Google.</p>
</div></section>

<section class="contact" id="contacto"><div class="wrap">
  <div class="rv"><h2>Ven a vernos</h2><address id="addr"></address><a class="btn" id="cBtn" target="_blank" rel="noopener">Reservar cita</a></div>
  <a class="map rv" id="map" target="_blank" rel="noopener"><b>Cómo llegar</b></a>
</div></section>

<footer><div class="wrap"><span id="foot"></span><a id="fIg" target="_blank" rel="noopener">Instagram</a></div></footer>

<a class="wa" id="wa" target="_blank" rel="noopener" aria-label="WhatsApp"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.4L3 29l6.8-1.8A13 13 0 0 0 16 29c7.2 0 13-5.8 13-13S23.2 3 16 3zm0 23.700c-2 0-3.900-.6-5.500-1.600l-.4-.2-4 1 1.100-3.900-.3-.4A10.700 10.700 0 1 1 16 26.700zm5.900-8c-.3-.2-1.900-.9-2.200-1-.3-.1-.5-.2-.7.200-.2.300-.8 1-1 1.200-.2.200-.4.200-.7.100-.3-.2-1.400-.5-2.600-1.600-1-.9-1.600-1.900-1.800-2.200-.2-.3 0-.5.100-.7l.5-.6c.2-.2.200-.3.300-.6.100-.2.100-.4 0-.6l-1-2.300c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.100-.9.400-.3.300-1.200 1.200-1.200 2.900s1.200 3.300 1.400 3.500c.2.200 2.400 3.700 5.900 5.100 3.500 1.400 3.500.9 4.100.9.600-.1 1.900-.8 2.200-1.500.3-.8.300-1.400.2-1.500-.1-.1-.3-.2-.6-.4z"/></svg></a>

<script>
(function(){
 var $=function(i){return document.getElementById(i)},W=CFG.book||"https://wa.me/"+CFG.wa+"?text="+encodeURIComponent("Hola, quiero pedir una cita");
 document.title=CFG.name;
 $("tEmail").textContent=CFG.top[0];$("tPhone").textContent=CFG.top[1];
 $("logo").textContent=CFG.name;$("foot").textContent="© "+CFG.name;$("fIg").href=CFG.ig;
 ["navBtn","hBtn","ctaBtn","cBtn"].forEach(function(i){$(i).href=W});if(CFG.wa){$("wa").href="https://wa.me/"+CFG.wa}else{$("wa").style.display="none"}
 $("navBtn").textContent=CFG.btn;$("hBtn").textContent=CFG.btn;
 $("hTitle").textContent=CFG.title;$("hSub").textContent=CFG.sub;$("ctaT").textContent=CFG.ctaT;$("ctaP").textContent=CFG.ctaP;$("ctaBtn").textContent=CFG.ctaB;
 if(CFG.heroImg)document.documentElement.style.setProperty("--hero","url('"+CFG.heroImg+"')");
 if(CFG.aboutImg){$("aImg").style.backgroundImage="url('"+CFG.aboutImg+"')";$("aImg").textContent=""}
 $("aTitle").textContent=CFG.name;
 $("aText").innerHTML=CFG.about.map(function(t){return"<p>"+t+"</p>"}).join("");
 $("stats").innerHTML=CFG.stats.map(function(s){return'<div><b data-n="'+s[0]+'" data-s="'+s[2]+'">0</b><span>'+s[1]+"</span></div>"}).join("");
 $("svc").innerHTML=CFG.services.map(function(s){return'<div class="card rv"><div class="ph"'+(s[2]?' style="background-image:url(\''+s[2]+'\')"':"")+">"+(s[2]?"":"Foto")+'</div><div class="t"><h3>'+s[0]+"</h3><p>"+s[1]+'</p><a class="btn sm" href="'+W+'" target="_blank" rel="noopener">Más información</a></div></div>'}).join("");
 if(CFG.total){$("rateTxt").textContent="Basado en "+CFG.total+" reseñas · valoración "+CFG.rating}else{document.querySelector(".rate").style.display="none"}
 $("revs").innerHTML=CFG.reviews.map(function(r){return'<div class="rev rv"><div class="who"><span class="av">'+r[0][0]+"</span>"+r[0]+'</div><div class="stars">★★★★★</div><p>'+r[1]+"</p></div>"}).join("");
 $("addr").textContent=CFG.address;
 $("map").href="https://www.google.com/maps/search/?api=1&query="+CFG.maps;
 var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.15});
 document.querySelectorAll(".rv").forEach(function(e){io.observe(e)});
 var co=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var el=e.target,n=+el.dataset.n,t=0;co.unobserve(el);
  var iv=setInterval(function(){t+=1/45;if(t>=1){t=1;clearInterval(iv)}el.textContent=Math.round(n*t).toLocaleString("es-ES")+el.dataset.s},25)})},{threshold:.6});
 document.querySelectorAll("[data-n]").forEach(function(e){co.observe(e)});
})();
</script>
</body>
</html>
